<div class="dash-card">
  <ul class="dash-recent-list">
    {% for item in tree %}
    <li>
      <a href="/{{ path }}/{{ item.path }}" class="dash-recent-entry">
        <div class="dash-recent-info" style="display: flex; align-items: center; gap: 8px;">
          {% if item.type == 'directory' %}
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted); flex-shrink: 0;"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          {% else %}
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted); flex-shrink: 0;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          {% endif %}
          <span class="dash-recent-name" style="font-weight: 500;">{{ item.name }}</span>
        </div>
      </a>
    </li>
    {% endfor %}
    {% if not tree %}
    <li class="dash-empty">This directory is empty.</li>
    {% endif %}
  </ul>
</div>
